name: Esteira CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # JOB 1 - TEST
  test:
    name: Test (Linter)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar HTMLHint
        run: npm install -g htmlhint

      - name: Validar HTML
        run: htmlhint index.html

      - name: Verificar CSS
        run: |
          if grep -q "ERRO_CSS" style.css; then
            echo "Erro encontrado no CSS!"
            exit 1
          else
            echo "CSS validado com sucesso!"
          fi

  # JOB 2 - BUILD
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar pasta dist
        run: mkdir -p dist

      - name: Copiar arquivos
        run: cp index.html style.css dist/

      - name: Confirmar entrega
        run: ls -la dist

      - name: Upload do artefato
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          if-no-files-found: error

  # JOB 3 - DEPLOY
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar artefato
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist/

      - name: Preparar para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
